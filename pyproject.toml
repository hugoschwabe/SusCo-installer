[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "susco"
version = "0.1.0"
description = "Measure the energy, token and latency cost of Qwen3 reasoning mode on MATH-500"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "datasets>=2.19",
  "tqdm>=4.66",
  "prometheus-client>=0.20",
  "sympy>=1.12",
  "math-verify>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
tokenize = ["transformers>=4.51"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
